<style>

  }
  *{box-sizing:border-box;}

  a{color:inherit;}

    color:#fff; padding:18px 18px 30px;
  }
  .hero::after{
    content:""; position:absolute; inset:0; opacity:.10; pointer-events:none;
    background-image:radial-gradient(#fff 1px, transparent 1px);
    background-size:16px 16px;
  }
  .topbar{display:flex; align-items:center; justify-content:space-between; position:relative; z-index:2;}
  .back-link{
    display:inline-flex; align-items:center; gap:6px; text-decoration:none; color:#fff;
    font-size:.85rem; font-weight:600; background:rgba(255,255,255,.15);
    padding:7px 12px; border-radius:999px; backdrop-filter:blur(4px);
  }
  .hero-badge{
    display:inline-flex; align-items:center; gap:6px; background:var(--pop); color:#3a2a00;
    font-weight:800; font-size:.72rem; letter-spacing:.03em; padding:5px 11px; border-radius:999px;
    box-shadow:0 3px 10px rgba(0,0,0,.25);
  }
  .hero h1{
    position:relative; z-index:2; font-size:1.65rem; line-height:1.25; margin:16px 0 6px;
    font-weight:800;
  }
  .hero p{position:relative; z-index:2; margin:0; font-size:.92rem; opacity:.92; max-width:46ch;}
  .hero-stats{
    position:relative; z-index:2; display:flex; gap:10px; margin-top:16px; flex-wrap:wrap;
  }
  .hero-stat{
    display:flex; align-items:center; gap:8px;
    background:rgba(255,255,255,.12); border:1px solid rgba(255,255,255,.22);
    border-radius:14px; padding:8px 14px 8px 10px; font-size:.78rem;
  }
  .hero-stat::before{
    content:""; flex:none; width:9px; height:9px; border-radius:50%;
  }
  .hero-stat:nth-child(1)::before{ background:#FF5C7A; }
  .hero-stat:nth-child(2)::before{ background:conic-gradient(#C8102E,#15803D,#1D4ED8,#7C3AED,#B45309,#0E7490,#C8102E); }
  .hero-stat:nth-child(3)::before{ background:var(--pop); }
  .hero-stat b{display:block; font-size:1.05rem;}

  /* ===== FILTER BAR ===== */
  .filter-wrap{
    position:sticky; top:0; z-index:20; background:var(--cream);
    border-bottom:1px solid var(--line); padding:10px 0;
  }
  .filter-scroll{
    display:flex; flex-wrap:wrap; gap:8px; padding:0 14px; justify-content:flex-start;
  }
  .chip{
    flex:0 0 auto; display:inline-flex; align-items:center; gap:6px;
    background:var(--paper); border:1.5px solid var(--line); color:var(--ink);
    font-size:.82rem; font-weight:600; padding:8px 14px; border-radius:999px;
    cursor:pointer; white-space:nowrap; transition:.15s;
  }
  .chip .count{
    background:var(--cream); color:var(--muted); font-size:.68rem; font-weight:700;
    padding:1px 6px; border-radius:999px;
  }
  .chip.active{background:var(--red); border-color:var(--red); color:#fff;}
  .chip.active .count{background:rgba(255,255,255,.25); color:#fff;}

  .chip[data-cat="pli"].active{ background:#B91C1C; border-color:#B91C1C; }
  .chip[data-cat="rpli"]{ border-color:#15803D; color:#15803D; }
  .chip[data-cat="rpli"].active{ background:#15803D; border-color:#15803D; }
  .chip[data-cat="tapal"]{ border-color:#1D4ED8; color:#1D4ED8; }
  .chip[data-cat="tapal"].active{ background:#1D4ED8; border-color:#1D4ED8; }

  .section-title{
    padding:20px 16px 8px; font-size:1.05rem; font-weight:800; color:var(--red-dark);
    display:flex; align-items:center; gap:8px; scroll-margin-top:64px;
  }
  .section-title .n{
    background:var(--gold); color:#fff; font-size:.7rem; font-weight:800;

  .masonry{

  }
  @media(min-width:640px){ .masonry{columns:3;} }
  @media(min-width:900px){ .masonry{columns:4;} }
  .card{
    break-inside:avoid; margin-bottom:10px; border-radius:var(--radius); overflow:hidden;
    background:var(--paper); border:1px solid var(--line); cursor:pointer;
    box-shadow:0 2px 6px rgba(36,24,20,.08); transition:transform .15s, box-shadow .15s;

  .card:active{transform:scale(.97);}
  .card img{display:block; width:100%; height:auto;}
  .card .cap{
    padding:8px 10px 10px; font-size:.74rem; font-weight:700; color:var(--ink); line-height:1.3;

  .hidden{display:none !important;}
  .empty-msg{

  .lightbox{

  {file:"govt-pmsby.jpg",  cat:"jansuraksha", title:"પ્રધાનમંત્રી સુરક્ષા વીમા યોજના (PMSBY)"},
  {file:"govt-apy.jpg",    cat:"jansuraksha", title:"અટલ પેન્શન યોજના (APY)"},

  {file:"track-speed-post.jpg",   cat:"anya", title:"ટપાલ ટ્રેક કરો"},
];

const IMG_DIR = "gallery-images/";

// ===== Render sections =====
const host = document.getElementById("gridHost");
CATS.forEach(cat => {
  const items = IMAGES.filter(i => i.cat === cat.id);
  if(items.length === 0) return;

  const title = document.createElement("div");
  title.className = "section-title";
  title.dataset.cat = cat.id;
  title.innerHTML = `${cat.label} <span class="n">${items.length}</span>`;
  host.appendChild(title);

  const grid = document.createElement("div");
  grid.className = "masonry";
  grid.dataset.cat = cat.id;

  items.forEach((item) => {
    const globalIndex = IMAGES.indexOf(item);
    const card = document.createElement("div");
    card.className = "card";
    card.dataset.cat = cat.id;
    card.dataset.index = globalIndex;
    card.innerHTML = `<img src="${IMG_DIR}${item.file}" alt="${item.title}" loading="lazy"><div class="cap">${item.title}</div>`;
    grid.appendChild(card);
  });

  host.appendChild(grid);
});

// ===== Filtering =====
const chips = document.querySelectorAll(".chip");
chips.forEach(chip => {
  chip.addEventListener("click", () => {
    chips.forEach(c => c.classList.remove("active"));
    chip.classList.add("active");
    const cat = chip.dataset.cat;
    if(typeof gtag === "function"){
      gtag('event', 'gallery_filter', { category: cat });
    }

    document.querySelectorAll(".section-title, .masonry").forEach(el => {
      if(cat === "all" || el.dataset.cat === cat){
        el.classList.remove("hidden");
      } else {
        el.classList.add("hidden");
      }
    });

    const visibleCount = (cat === "all")
      ? IMAGES.length
      : IMAGES.filter(i => i.cat === cat).length;
    document.getElementById("emptyMsg").classList.toggle("hidden", visibleCount > 0);

    if(cat !== "all"){
      const target = document.querySelector(`.section-title[data-cat="${cat}"]`);
      if(target){
        window.scrollTo({top: target.getBoundingClientRect().top + window.scrollY - 58, behavior:"smooth"});
      }
    } else {
      window.scrollTo({top:0, behavior:"smooth"});
    }
  });
});

// ===== Lightbox =====
const lb = document.getElementById("lightbox");
const lbImg = document.getElementById("lbImg");
const lbCat = document.getElementById("lbCat");
const lbTitle = document.getElementById("lbTitle");
const lbCount = document.getElementById("lbCount");
let currentIndex = 0;

function openLightbox(index){
  currentIndex = index;
  renderLightbox();
  lb.classList.add("open");
  document.body.style.overflow = "hidden";
  if(typeof gtag === "function"){
    const item = IMAGES[index];
    gtag('event', 'gallery_photo_view', { category: item.cat, photo: item.file });
  }
}
function closeLightbox(){
  lb.classList.remove("open");
  document.body.style.overflow = "";
}
function renderLightbox(){
  const item = IMAGES[currentIndex];
  const catLabel = CATS.find(c => c.id === item.cat)?.label || "";
  lbImg.src = IMG_DIR + item.file;
  lbImg.alt = item.title;
  lbCat.textContent = catLabel;
  lbTitle.textContent = item.title;
  lbCount.textContent = `${currentIndex + 1} / ${IMAGES.length}`;
}
function nextImg(){ currentIndex = (currentIndex + 1) % IMAGES.length; renderLightbox(); }
function prevImg(){ currentIndex = (currentIndex - 1 + IMAGES.length) % IMAGES.length; renderLightbox(); }

host.addEventListener("click", (e) => {
  const card = e.target.closest(".card");
  if(!card) return;
  openLightbox(parseInt(card.dataset.index, 10));
});

document.getElementById("lbClose").addEventListener("click", closeLightbox);
document.getElementById("lbNext").addEventListener("click", nextImg);
document.getElementById("lbPrev").addEventListener("click", prevImg);
lb.addEventListener("click", (e) => { if(e.target === lb || e.target.id === "lbStage") closeLightbox(); });

document.addEventListener("keydown", (e) => {
  if(!lb.classList.contains("open")) return;
  if(e.key === "Escape") closeLightbox();
  if(e.key === "ArrowRight") nextImg();
  if(e.key === "ArrowLeft") prevImg();
});

// swipe support
let touchStartX = 0;
lb.addEventListener("touchstart", (e) => { touchStartX = e.changedTouches[0].screenX; });
lb.addEventListener("touchend", (e) => {
  const dx = e.changedTouches[0].screenX - touchStartX;
  if(Math.abs(dx) > 40){ dx > 0 ? prevImg() : nextImg(); }
});
</script>
